<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<title>kennel</title>
<style>
:root{--bg:#f6f6f4;--surface:#fff;--ink:#1c1c1a;--soft:#5d5d58;--line:#e2e2dd;--tint:#efefeb;--acc:#2f5fd0;--acc-t:#e8eefb;--ok:#1d7a3e;--ok-t:#e3f3e8;--warn:#9a5b00;--warn-t:#fbf0dc;--bad:#b42318;--bad-t:#fbe6e4;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--surface:#1f1f1d;--ink:#ecece8;--soft:#a3a39c;--line:#33332f;--tint:#282825;--acc:#86a8f5;--acc-t:#22304f;--ok:#7fd49b;--ok-t:#1d3326;--warn:#f0bd6a;--warn-t:#3a2e17;--bad:#f59a8f;--bad-t:#3d211e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--surface:#1f1f1d;--ink:#ecece8;--soft:#a3a39c;--line:#33332f;--tint:#282825;--acc:#86a8f5;--acc-t:#22304f;--ok:#7fd49b;--ok-t:#1d3326;--warn:#f0bd6a;--warn-t:#3a2e17;--bad:#f59a8f;--bad-t:#3d211e;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans)}
.app{display:grid;grid-template-rows:44px 1fr;height:720px;width:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.top h1{font-size:15px;font-weight:650;margin:0}
.sp{flex:1}
button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line);padding:4px 11px;color:var(--soft);font-size:12.5px;white-space:nowrap;background:var(--surface)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--surface);font-weight:600}
.seg.ic button{display:inline-flex;align-items:center;padding:5px 10px}
.seg.ic svg{display:block}
.pick{position:relative}
.dd{position:absolute;top:34px;right:0;width:380px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:5;padding:6px}
.dd input{width:100%;box-sizing:border-box;font:13px var(--sans);padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.dd .list{max-height:300px;overflow:auto;margin-top:4px}
.dd .it{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;font:12.5px var(--mono);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd .it.on,.dd .it:hover{background:var(--acc-t);color:var(--acc)}
.dd .choose{font-family:var(--sans)}
.dd hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.body{display:grid;grid-template-columns:220px 1fr;min-height:0}
.side{border-right:1px solid var(--line);background:var(--surface);padding:12px 8px;overflow:auto}
.side h3{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);margin:16px 8px 4px;font-weight:600}
.side h3:first-child{margin-top:0}
.nav a{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none}
.nav a.on{background:var(--acc-t);color:var(--acc);font-weight:600}
.nav a .n{color:var(--soft);font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.main{padding:16px 20px;overflow:hidden;min-width:0;min-height:0;display:flex}
.gv{flex:1;display:grid;grid-template-columns:210px 1fr 210px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;min-height:0}
.gv .files{border-right:1px solid var(--line);padding:8px;overflow:auto}
.gv .hist{border-left:1px solid var(--line);padding:8px;overflow:auto}
.gv .doc{padding:14px 20px;overflow:auto;min-width:0}
.gv .f{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:6px;font:12px var(--mono);color:var(--ink)}
.gv .f:hover{background:var(--tint)}
.gv .f.on{background:var(--acc-t);color:var(--acc);font-weight:600}
.gv .f.dir{font-weight:600}
.gv .f .tw{width:10px;flex:none;color:var(--soft);font-family:var(--sans)}
.gv .f .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gv .grp{margin:10px 4px 4px}
.gv .grp:first-child{margin-top:0}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.tag.p{background:var(--acc);color:var(--surface)}
.tag.g{background:var(--soft);color:var(--surface)}
.vlt{color:var(--acc)}
.vlt svg{margin-left:5px;vertical-align:-2px}
.gv .c{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;font-size:12px;line-height:1.35;color:var(--ink)}
.gv .c:hover{background:var(--tint)}
.gv .c.on{background:var(--acc-t)}
.gv .c b{font:11.5px var(--mono);color:var(--acc)}
.gv .c .d{color:var(--soft);font-size:11px}
.fm{background:var(--tint);border-radius:6px;padding:8px 12px;margin-bottom:14px;font-size:12.5px}
.doc h1{font-size:18px;margin:0 0 10px}.doc h2{font-size:14px;margin:16px 0 6px}.doc h3{font-size:13px;margin:14px 0 6px}
.doc p,.doc li{font-size:13px;line-height:1.55;margin:0 0 8px}.doc ul{padding-left:18px;margin:0 0 8px}.doc ol{padding-left:20px}
.doc code{font:12px var(--mono);background:var(--tint);padding:1px 4px;border-radius:4px}
.doc pre{background:var(--tint);padding:8px 10px;border-radius:6px;overflow:auto;margin:0 0 10px}
.doc pre code{background:none;padding:0}
.doc pre.code{font:11.5px/1.5 var(--mono);white-space:pre;background:none;padding:0;margin:0}
.doc table{border-collapse:collapse;width:100%;font-size:12px;margin-bottom:10px}
.doc th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.doc td{padding:6px 8px;vertical-align:top}
.doc tbody tr:nth-child(even) td{background:var(--tint)}
.doc a{color:var(--acc)}
.doc hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.err{color:var(--soft);font:12px var(--mono);white-space:pre-wrap}
.gv .doc{position:relative}
.doc mark.hl{display:inline-block;min-width:100%;background:var(--acc-t);color:inherit}
.gv .f .cnt{margin-left:auto;padding-left:8px;color:var(--soft);font:12px var(--sans);font-variant-numeric:tabular-nums;font-weight:400}
.gen{display:inline-flex;margin-left:5px;color:var(--acc);flex:none}
.gv .f.bad .nm{color:var(--bad)}
.gv .f.wrap .nm{white-space:normal;overflow-wrap:anywhere}
.gv .hist{overflow-x:hidden}.gv .c{overflow-wrap:anywhere}
.dec{font:600 11px var(--sans);padding:1px 7px;border-radius:4px;background:var(--tint);color:var(--soft)}
.dec.allow{background:var(--ok-t);color:var(--ok)}.dec.ask{background:var(--warn-t);color:var(--warn)}.dec.deny{background:var(--bad-t);color:var(--bad)}
</style>
</head>

<script>
"use strict";
const VAULT_ICON = '<svg width="13" height="13" viewBox="0 0 16 16" role="img" aria-label="Linked to vault"><title>Linked to vault</title><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 5.4v1.2M8 9.4v1.2M5.4 8h1.2M9.4 8h1.2" stroke="currentColor" stroke-width="1.2"/></svg>';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---- MCP Apps bridge: JSON-RPC 2.0 over postMessage to the host ----
let nextId = 1;
const pending = new Map();
const post = m => window.parent.postMessage(m, "*");
function request(method, params) {
  const id = nextId++;
  post({jsonrpc: "2.0", id, method, params});
  return new Promise((res, rej) => pending.set(id, {res, rej}));
}
const notify = (method, params) => post({jsonrpc: "2.0", method, params});
window.addEventListener("message", e => {
  const m = e.data;
  if (e.source !== window.parent || !m || m.jsonrpc !== "2.0") return;
  if (m.method === undefined && pending.has(m.id)) {
    const p = pending.get(m.id); pending.delete(m.id);
    m.error ? p.rej(new Error(m.error.message)) : p.res(m.result);
    return;
  }
  switch (m.method) {
    case "ui/notifications/tool-input": onToolInput(m.params && m.params.arguments || {}); break;
    case "ui/notifications/tool-result": onToolResult(m.params || {}); break;
    case "ui/notifications/host-context-changed": applyContext(m.params || {}); break;
  }
  if (m.id === undefined || m.method === undefined) return;
  if (m.method === "ping" || m.method === "ui/resource-teardown") post({jsonrpc: "2.0", id: m.id, result: {}});
  else post({jsonrpc: "2.0", id: m.id, error: {code: -32601, message: "Method not found"}});
});
function applyContext(ctx) {
  if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
}

// kennel runs one kennel command through the server's kennel tool.
async function kennel(...args) {
  const r = await request("tools/call", {name: "kennel", arguments: {args}});
  const text = (r.content || []).map(c => c.text || "").join("");
  if (r.isError) throw new Error(text);
  return text;
}
const kennelJSON = async (...args) => JSON.parse(await kennel(...args, "--json"));

// ---- state ----
const SECTIONS = {skills: "Skills", guidance: "Guidance", permissions: "Permissions", hooks: "Hooks", mcp: "MCP servers"};
const S = {
  scope: "global",   // "global" or a directory
  harness: "claude",
  project: null,     // the directory the project segment names
  section: "skills",
  shows: {},         // harness show <section> per section, or {error}
  open: new Set(),   // open folders and groups, by key
  items: new Map(),  // tree key -> {file, find}: the file a row opens, and the line to mark in it
  sel: null,         // selected tree key
  file: null, find: null,
  commits: [], rev: null,
  recent: [],
};

function onToolInput(a) {
  if (a.harness) S.harness = a.harness;
  if (a.directory) S.project = a.directory;
  renderTop();
}
function onToolResult(r) {
  if (r.isError) { showError((r.content || []).map(c => c.text).join("")); return; }
  if (r.structuredContent && loadSeq === 0) { setScope(r.structuredContent); load(); } // a pick made before it arrived wins
}

// Each load and file pick takes a number; a reply for an older one is dropped.
// A load reads every section, so the counts are whole and every file a page
// opens has been listed by a harness show first.
let loadSeq = 0, fileSeq = 0;
async function load() {
  const seq = ++loadSeq;
  renderTop();
  const names = Object.keys(SECTIONS);
  const got = await Promise.allSettled(names.map(s => kennelJSON("harness", "show", s, "--scope", S.scope, "--harness", S.harness)));
  if (seq !== loadSeq) return;
  S.shows = {};
  got.forEach((g, i) => S.shows[names[i]] = g.status === "fulfilled" ? g.value : {error: g.reason.message});
  const ok = got.find(g => g.status === "fulfilled");
  if (ok) setScope(ok.value);
  renderTop(); renderCounts(); openPage();
}
function setScope(show) {
  S.harness = show.harness;
  if (show.scope.kind === "project") { S.scope = show.scope.dir; S.project = show.scope.root; }
  else S.scope = "global";
}
function showError(msg) { $("doc").innerHTML = '<div class="err">' + esc(msg) + "</div>"; }

// ---- top bar ----
const base = p => p.replace(/\/+$/, "").split("/").pop();
function renderTop() {
  const project = S.project || (S.recent[0] && S.recent[0].dir);
  $("global").className = S.scope === "global" ? "on" : "";
  $("project").className = S.scope === "global" ? "" : "on";
  $("project").textContent = (project ? base(project) : "Project") + " ▾";
  document.querySelectorAll("[data-h]").forEach(b => {
    b.className = b.dataset.h === S.harness ? "on" : "";
    b.setAttribute("aria-pressed", b.dataset.h === S.harness);
  });
}
function renderCounts() {
  for (const s of Object.keys(SECTIONS)) {
    const show = S.shows[s];
    $("n-" + s).textContent = show && show.blocks ? show.blocks.map(b => b.entries.length).join(" + ") : "";
  }
}

$("global").onclick = () => { S.scope = "global"; load(); };
document.querySelectorAll("[data-h]").forEach(b => b.onclick = () => { S.harness = b.dataset.h; load(); });
document.querySelectorAll("[data-sec]").forEach(a => a.onclick = e => { e.preventDefault(); if (S.section !== a.dataset.sec) { S.section = a.dataset.sec; openPage(); } });

// ---- project picker ----
$("project").onclick = async () => {
  const dd = $("dd");
  if (!dd.hidden) { dd.hidden = true; return; }
  dd.hidden = false; $("filter").value = ""; renderRecent(); $("filter").focus();
  try { S.recent = await kennelJSON("harness", "recent"); renderRecent(); } catch (e) {}
};
function renderRecent() {
  const q = $("filter").value.trim().toLowerCase();
  const cur = S.scope === "global" ? null : S.project;
  $("recent").innerHTML = S.recent.filter(d => !q || d.short.toLowerCase().includes(q)).map(d =>
    `<button class="it${d.dir === cur ? " on" : ""}" role="option" data-dir="${esc(d.dir)}">${esc(d.short)}</button>`).join("");
}
const openDir = dir => { $("dd").hidden = true; S.scope = dir; S.project = dir; load(); };
$("filter").oninput = renderRecent;
$("filter").onkeydown = e => {
  if (e.key === "Escape") { $("dd").hidden = true; $("project").focus(); }
  if (e.key !== "Enter") return;
  const v = $("filter").value.trim();
  if (v.startsWith("/") || v.startsWith("~")) return openDir(v);
  const hit = $("recent").querySelector(".it");
  if (hit) openDir(hit.dataset.dir);
};
$("recent").onclick = e => { const b = e.target.closest(".it"); if (b) openDir(b.dataset.dir); };
$("choose").onclick = () => { $("filter").value = "~/"; renderRecent(); $("filter").focus(); };
document.addEventListener("mousedown", e => { if (!e.target.closest(".pick")) $("dd").hidden = true; });

// ---- page ----
// openPage shows the current section: its tree, then its first row's file.
function openPage() {
  document.querySelectorAll("[data-sec]").forEach(a => {
    a.className = a.dataset.sec === S.section ? "on" : "";
    a.toggleAttribute("aria-current", a.dataset.sec === S.section);
  });
  $("tree").setAttribute("aria-label", SECTIONS[S.section]);
  fileSeq++;
  S.sel = S.file = S.find = S.rev = null; S.commits = [];
  $("doc").innerHTML = ""; renderHist();
  const show = S.shows[S.section];
  if (!show) { $("tree").innerHTML = ""; return; }
  if (show.error) { $("tree").innerHTML = ""; showError(show.error); return; }
  S.open = defaultOpen(show);
  renderTree();
  const first = $("tree").querySelector("[data-key]");
  if (first) select(first.dataset.key);
}
// defaultOpen opens the first skill, and on Hooks and Permissions the groups
// of the block the scope names, leaving the inherited Global block closed.
function defaultOpen(show) {
  const open = new Set();
  if (S.section === "skills") {
    const b = show.blocks.find(b => b.entries.length);
    if (b) open.add(b.entries[0].path);
  }
  if (S.section === "hooks" || S.section === "permissions") {
    for (const b of show.blocks) if (b.scope === show.scope.kind)
      for (const g of groups(b)) open.add(b.scope + ":" + g.name);
  }
  return open;
}
// groups splits a Hooks block by event, most hooks first, or a Permissions
// block by decision.
const DECISIONS = ["allow", "ask", "deny"];
function groups(b) {
  const by = new Map();
  b.entries.forEach((e, i) => {
    const k = S.section === "hooks" ? e.event : e.decision;
    if (!by.has(k)) by.set(k, []);
    by.get(k).push([e, i]);
  });
  const gs = [...by].map(([name, entries]) => ({name, entries}));
  if (S.section === "hooks") return gs.sort((a, b) => b.entries.length - a.entries.length);
  const rank = d => DECISIONS.includes(d) ? DECISIONS.indexOf(d) : DECISIONS.length;
  return gs.sort((a, b) => rank(a.name) - rank(b.name));
}

// ---- tree ----
// nest turns relative file paths into nested folders.
function nest(files) {
  const root = {dirs: {}, files: []};
  for (const f of files) {
    const parts = f.split("/"); let n = root;
    for (const p of parts.slice(0, -1)) n = n.dirs[p] = n.dirs[p] || {dirs: {}, files: []};
    n.files.push(parts[parts.length - 1]);
  }
  return root;
}
const countFiles = n => n.files.length + Object.values(n.dirs).reduce((s, d) => s + countFiles(d), 0);
const CLAUDE_MARK = () => `<span class="gen" role="img" aria-label="From Claude's hooks" title="From Claude's hooks"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="${esc(document.querySelector('[data-h="claude"] path').getAttribute("d"))}"/></svg></span>`;

// Lines to mark: a permission rule, an MCP server or an inline hook command
// in the settings file that holds it. The mark goes on the first matching
// line after the anchor (the rule's decision key, the hook's event), so a
// rule under both allow and deny marks the right one.
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const findRule = e => e.decision === "setting"
  ? {match: (k => line => new RegExp("^\\s*" + reEsc(k) + "\\s*=").test(line))(e.rule.split(" = ")[0])}
  : {anchor: JSON.stringify(e.decision) + ":", match: line => line.includes(JSON.stringify(e.rule))};
const findServer = name => {
  const toml = new RegExp("^\\s*\\[mcp_servers\\.(" + reEsc(name) + "|" + reEsc(JSON.stringify(name)) + ")\\]");
  return {match: line => line.includes(JSON.stringify(name) + ":") || toml.test(line)};
};
const findCommand = e => e.command ? {anchor: JSON.stringify(e.event), match: line => line.includes(JSON.stringify(e.command).slice(1, -1))} : null;
// markLine is the index of the line find marks, or -1.
function markLine(lines, find) {
  if (!find) return -1;
  const from = find.anchor ? lines.findIndex(l => l.includes(find.anchor)) : -1;
  const after = lines.findIndex((l, i) => i >= from && find.match(l));
  return after >= 0 ? after : lines.findIndex(find.match);
}

function renderTree() {
  const show = S.shows[S.section], out = [];
  S.items = new Map();
  const row = (cls, depth, tw, name, attrs, after = "") =>
    out.push(`<button class="f ${cls}" style="padding-left:${8 + depth * 14}px" ${attrs}><span class="tw">${tw}</span><span class="nm">${name}</span>${after}</button>`);
  const folder = (key, depth, name, count) => {
    const open = S.open.has(key);
    row("dir", depth, open ? "▾" : "▸", name, `role="treeitem" aria-expanded="${open}" data-dir="${esc(key)}"`, count === undefined ? "" : `<span class="cnt">${count}</span>`);
    return open;
  };
  const leaf = (key, depth, name, item, after = "", title = "", cls = "") => {
    S.items.set(key, item);
    row((S.sel === key ? "on " : "") + cls, depth, "", name, `role="treeitem" data-key="${esc(key)}"${title ? ` title="${esc(title)}"` : ""}`, after);
  };

  // a skill's files: SKILL.md first, then folders, then files
  const walkSkill = (node, path, depth) => {
    const files = node.files.slice().sort((a, b) => (a === "SKILL.md" ? -1 : b === "SKILL.md" ? 1 : a.localeCompare(b)));
    const file = f => leaf(path + "/" + f, depth, esc(f), {file: path + "/" + f});
    if (files[0] === "SKILL.md") file(files.shift());
    for (const d of Object.keys(node.dirs).sort())
      if (folder(path + "/" + d, depth, esc(d))) walkSkill(node.dirs[d], path + "/" + d, depth + 1);
    files.forEach(file);
  };
  // guidance: files first, the harness's own file leading, then folders with
  // their file counts; a folder holding only one folder joins its name
  const main = f => f === "CLAUDE.md" || f === "AGENTS.md";
  const walkGuidance = (node, path, depth) => {
    node.files.slice().sort((a, b) => main(b) - main(a) || (a < b ? -1 : a > b ? 1 : 0))
      .forEach(f => leaf(path + "/" + f, depth, esc(f), {file: path + "/" + f}));
    for (let d of Object.keys(node.dirs).sort()) {
      let n = node.dirs[d], name = d;
      while (!n.files.length && Object.keys(n.dirs).length === 1) { const k = Object.keys(n.dirs)[0]; name += "/" + k; n = n.dirs[k]; }
      if (folder(path + "/" + name + "/", depth, esc(name + "/"), countFiles(n))) walkGuidance(n, path + "/" + name, depth + 1);
    }
  };

  for (const b of show.blocks) {
    out.push(`<div class="grp"><span class="tag ${b.scope === "project" ? "p" : "g"}">${b.scope === "project" ? "Project" : "Global"}</span></div>`);
    if (S.section === "skills") for (const s of b.entries) {
      const name = s.vault ? `<span class="vlt">${esc(s.name)}${VAULT_ICON}</span>` : esc(s.name);
      if (folder(s.path, 0, name)) walkSkill(nest(s.files), s.path, 1);
    }
    if (S.section === "guidance") walkGuidance(nest(b.entries.map(e => e.rel)), b.path, 0);
    if (S.section === "hooks") for (const g of groups(b)) {
      if (!folder(b.scope + ":" + g.name, 0, esc(g.name), g.entries.length)) continue;
      for (const [e, i] of g.entries) {
        const words = (e.command || "").trim().split(/\s+/);
        const name = e.script ? base(e.script) : words[0] + (words.length > 1 ? " …" : "");
        leaf(b.scope + ":" + i, 1, esc(name || e.event), e.script ? {file: e.script} : {file: e.file, find: findCommand(e)},
          e.generated ? CLAUDE_MARK() : "", e.problem || e.command, e.problem ? "wrap bad" : "wrap");
      }
    }
    if (S.section === "permissions") for (const g of groups(b)) {
      if (!folder(b.scope + ":" + g.name, 0, `<span class="dec ${esc(g.name)}">${esc(g.name)}</span>`, g.entries.length)) continue;
      for (const [e, i] of g.entries) leaf(b.scope + ":" + i, 1, esc(e.rule), {file: e.file, find: findRule(e)}, "", e.rule);
    }
    if (S.section === "mcp") b.entries.forEach((e, i) =>
      leaf(b.scope + ":" + i, 0, esc(e.name), {file: e.file, find: findServer(e.name)}));
  }
  $("tree").innerHTML = out.join("");
}
$("tree").onclick = e => {
  const b = e.target.closest(".f"); if (!b) return;
  if (b.dataset.dir) { const d = b.dataset.dir; S.open.has(d) ? S.open.delete(d) : S.open.add(d); renderTree(); }
  else select(b.dataset.key);
};
function select(key) {
  const it = S.items.get(key); if (!it) return;
  S.sel = key; S.find = it.find || null;
  selectFile(it.file);
}

// ---- reader and commits ----
async function selectFile(path) {
  const seq = ++fileSeq;
  S.file = path; S.rev = null; S.commits = [];
  renderTree(); renderHist();
  const [text, commits] = await Promise.allSettled([kennel("file", "show", path), kennelJSON("file", "log", path)]);
  if (seq !== fileSeq) return;
  S.commits = commits.status === "fulfilled" ? commits.value : [];
  renderHist();
  text.status === "fulfilled" ? renderDoc(path, text.value) : showError(text.reason.message);
}
async function selectRev(i) {
  const seq = ++fileSeq, path = S.file, c = S.commits[i];
  S.rev = i === 0 ? null : c.commit;
  renderHist();
  try {
    const text = await kennel("file", "show", S.rev ? path + "@" + S.rev : path);
    if (seq === fileSeq) renderDoc(path, text);
  } catch (e) { if (seq === fileSeq) showError(e.message); }
}
function renderHist() {
  const on = S.rev ? S.commits.findIndex(c => c.commit === S.rev) : 0;
  $("hist").innerHTML = S.commits.map((c, i) =>
    `<button class="c${i === on ? " on" : ""}" data-i="${i}"><b>${esc(c.short)}</b> <span class="d">${esc(c.date.slice(0, 10))}</span><br>${esc(c.subject)}</button>`).join("");
}
$("hist").onclick = e => { const b = e.target.closest(".c"); if (b) selectRev(+b.dataset.i); };

// frontmatter splits a leading --- block off a markdown file and returns
// its description, the one key the reader shows.
function frontmatter(text) {
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  if (!m) return {desc: "", body: text};
  const lines = m[1].split(/\r?\n/);
  let desc = "";
  for (let i = 0; i < lines.length; i++) {
    const k = lines[i].match(/^description:\s*(.*)$/);
    if (!k) continue;
    let v = k[1].trim();
    if (v === "" || /^[|>][+-]?$/.test(v)) {
      const more = [];
      while (i + 1 < lines.length && /^(\s+|$)/.test(lines[i + 1]) && lines[i + 1] !== "") more.push(lines[++i].trim());
      v = more.join(" ");
    }
    desc = v.replace(/^(["'])([\s\S]*)\1$/, "$2");
  }
  return {desc, body: text.slice(m[0].length)};
}
// clean sanitizes rendered markdown: a skill file is someone else's text.
const clean = html => DOMPurify.sanitize(html, {FORBID_TAGS: ["style", "form"]});
function renderDoc(path, text) {
  const doc = $("doc");
  if (/\.(md|markdown)$/i.test(path)) {
    const {desc, body} = frontmatter(text);
    doc.innerHTML = (desc ? `<div class="fm">${esc(desc)}</div>` : "") + clean(marked.parse(body));
    doc.scrollTop = 0;
  } else {
    // a settings file marks the line that holds the selected entry
    const lines = text.split("\n"), hit = markLine(lines, S.find);
    doc.innerHTML = `<pre class="code">${lines.map((l, i) => i === hit ? `<mark class="hl">${esc(l)}</mark>` : esc(l)).join("\n")}</pre>`;
    const m = doc.querySelector(".hl");
    doc.scrollTop = m ? Math.max(0, m.offsetTop - 60) : 0;
  }
}
$("doc").addEventListener("click", e => {
  const a = e.target.closest("a[href]"); if (!a) return;
  e.preventDefault();
  if (/^https?:/i.test(a.getAttribute("href"))) request("ui/open-link", {url: a.href}).catch(() => {});
});

// ---- start ----
(async () => {
  renderTop();
  try {
    const r = await request("ui/initialize", {appInfo: {name: "kennel", version: "0.1.0"}, appCapabilities: {}, protocolVersion: "2026-01-26"});
    applyContext((r && r.hostContext) || {});
  } catch (e) {}
  notify("ui/notifications/initialized", {});
  notify("ui/notifications/size-changed", {width: document.documentElement.scrollWidth, height: 720});
  kennelJSON("harness", "recent").then(r => { S.recent = r; renderTop(); }).catch(() => {});
})();
</script>
</body>
</html>
